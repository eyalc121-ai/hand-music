<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>רמקול · נגן ידיים</title>
<style>
body{margin:0;background:#0b0f1a;color:#e6e9f2;font-family:system-ui,"Segoe UI",Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{margin:12px 0 4px;background:linear-gradient(90deg,#7dd3fc,#c084fc);-webkit-background-clip:text;color:transparent;font-size:32px}
p.sub{margin:0 0 16px;color:#8b93a7;text-align:center}
#status{padding:8px 18px;border-radius:999px;background:#1f2937;font-weight:700;margin-bottom:16px}
#status.ok{background:#14532d;color:#86efac}
#status.bad{background:#7f1d1d;color:#fecaca}
button{font-size:28px;padding:18px 48px;border:0;border-radius:999px;background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;cursor:pointer;margin:8px}
button:disabled{opacity:.55;cursor:default}
.card{background:#111827;border-radius:16px;padding:16px 20px;margin-top:16px;width:min(520px,92vw);text-align:center}
#notes{font-size:20px;line-height:1.6;min-height:1.6em}
#err{color:#f87171;min-height:1.4em;margin-top:12px;text-align:center;max-width:520px}
#room{color:#7dd3fc;word-break:break-all;font-size:14px}
#masterRead{margin-top:8px;font-size:22px;font-weight:700;color:#86efac}
#light{position:fixed;inset:0;z-index:4;display:none;background:#000}
#light.on{display:block}
#dock{position:fixed;bottom:12px;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:8px}
#dock button{font-size:16px;padding:10px 18px;margin:0}
#torchNote{position:fixed;top:10px;left:12px;right:12px;z-index:6;background:#fff;color:#111;border-radius:12px;padding:8px 12px;text-align:center;font-size:14px}
</style>
</head>
<body>
<h1>🔊 רמקול</h1>
<p class="sub" id="sub">השמעה מהנגן שעל המחשב · 122 BPM · 8 תיבות</p>
<div id="masterRead">עוצמה 100%</div>
<div id="status">ממתינים להפעלת צליל</div>
<button id="go">הפעל צליל</button>
<div id="light"></div>
<div id="dock"><button id="full" type="button">מסך מלא</button></div>
<p id="torchNote" hidden>הפנס לא זמין באייפון. ההבהוב על המסך כן עובד. בכרום באנדרואיד אפשר להדליק פנס לפי הקצב.</p>
<div class="card"><div id="room"></div><div id="notes">אין תווים כרגע</div></div>
<div id="err"></div>
<script src="engine.js"></script>
<script>
const N={R:[["דו C4",261.63],["רה D4",293.66],["מי E4",329.63],["פה F4",349.23],["סול G4",392]],
 L:[["סול G4",392],["לה A4",440],["סי B4",493.88],["דו C5",523.25],["רה D5",587.33]]};
const HAND={R:"ימין",L:"שמאל"};
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const room=(params.get("room")||"").trim();
let ac,voices,hg,peer,conn,epoch=0,attempt=0,timer=null,remotePaused=false,engine,pingTimer=null,masterGain=null,masterPct=100;
let origin=0,offset=0,holdPos=0,remoteMode="notes";
const volStore={R:0,L:0},bandOn={R:[0,0,0,0,0],L:[0,0,0,0,0]},recent=[];
function hostNow(){return Date.now()+offset;}
function groovePos(){if(remotePaused)return holdPos;if(!origin||typeof HM==="undefined")return 0;
 let s=((hostNow()-origin)/1000)%HM.LOOP;if(s<0)s+=HM.LOOP;return s;}
function takeClock(d,rtt){if(!d||typeof HM==="undefined")return;
 if(d.bpm&&HM.setBpm)HM.setBpm(d.bpm);
 if(d.master!=null&&Number.isFinite(Number(d.master)))applyMaster(d.master);
 if(d.bpm&&$("sub"))$("sub").textContent="השמעה מהנגן · "+HM.BPM+" BPM · 8 תיבות";
 if(typeof rtt==="number")offset=d.hostNow-(d.t+rtt/2);else if(!offset)offset=d.hostNow-Date.now();
 if(d.origin)origin=d.origin;
 if(d.paused){remotePaused=true;holdPos=d.pos||0;if(engine)engine.stopAll();return;}
 remotePaused=false;
 if(engine&&(remoteMode==="band"||remoteMode==="orch")){engine.setEnabled(true);engine.align(groovePos());}}
function showErr(m){$("err").textContent=m;console.error(m);}
function setStatus(m,kind){const s=$("status");s.textContent=m;s.className=kind||"";}
window.addEventListener("error",e=>showErr("שגיאה: "+(e.message||e)));
window.addEventListener("unhandledrejection",e=>showErr("שגיאה: "+(e.reason&&e.reason.message||e.reason||e)));
function renderNotes(){
 const on=[];
 if(voices)for(const k of ["R","L"])voices[k].forEach((vc,j)=>{if(vc.on)on.push(HAND[k]+" · "+(vc.label||N[k][j][0]));});
 if((remoteMode==="band"||remoteMode==="orch")&&typeof HM!=="undefined")for(const k of ["R","L"])for(let j=0;j<5;j++)if(bandOn[k][j])on.push(HAND[k]+" · "+(remoteMode==="orch"?HM.ORCH:HM.BAND)[k][j]);
 for(const name of recent)on.push(name);
 $("notes").textContent=on.length?on.join("  ·  "):(remoteMode==="orch"?"פילהרמונית ממתינה לאצבעות":remoteMode==="band"?"תזמורת ממתינה לאצבעות":remoteMode==="drums"?"מצב תופים":"אין תווים כרגע");
}
function showHit(name){recent.push(name);renderNotes();setTimeout(()=>{recent.shift();renderNotes();},480);}
function applyMaster(pct){const n=Math.max(0,Math.min(100,Math.round(Number(pct))));if(!Number.isFinite(n))return;masterPct=n;
 if($("masterRead"))$("masterRead").textContent="עוצמה "+n+"%";
 if(masterGain&&ac){const g=typeof HM!=="undefined"&&HM.masterFromPercent?HM.masterFromPercent(n):(n/100)*1.85;
  masterGain.gain.cancelScheduledValues(ac.currentTime);masterGain.gain.setTargetAtTime(g,ac.currentTime,0.03);}}
function audio(){
 ac=new AudioContext();
 masterGain=ac.createGain();
 masterGain.gain.value=typeof HM!=="undefined"&&HM.masterFromPercent?HM.masterFromPercent(masterPct):(masterPct/100)*1.85;
 const limiter=typeof HM!=="undefined"&&HM.makeLimiter?HM.makeLimiter(ac):ac.createDynamicsCompressor();
 masterGain.connect(limiter);limiter.connect(ac.destination);
 voices={};hg={};
 for(const k of ["R","L"]){
  hg[k]=ac.createGain();hg[k].gain.value=0;hg[k].connect(masterGain);
  voices[k]=N[k].map(([name,f])=>{const o=ac.createOscillator();o.type="triangle";o.frequency.value=f;
   const g=ac.createGain();g.gain.value=0;o.connect(g).connect(hg[k]);o.start();return{g,on:false,label:name};});
 }
 if(typeof HM==="undefined")throw new Error("מנוע הצליל לא נטען");
 engine=HM.createEngine(ac,masterGain,groovePos);
}
function stopAll(){
 if(!ac)return;
 const t=ac.currentTime;
 for(const k of ["R","L"]){
  hg[k].gain.cancelScheduledValues(t);hg[k].gain.setValueAtTime(0,t);
  voices[k].forEach(vc=>{vc.on=false;vc.g.gain.cancelScheduledValues(t);vc.g.gain.setValueAtTime(0,t);});
  bandOn[k]=[0,0,0,0,0];
 }
 recent.length=0;
 if(engine)engine.stopAll();
 renderNotes();
}
function applyMsg(d){
 if(typeof d==="string")d=JSON.parse(d);
 if(!d||typeof d!=="object")throw new Error("הודעה לא תקינה מהמחשב");
 if(!ac)throw new Error("השמע עוד לא הופעל");
 if(d.t==="pause"){remotePaused=true;holdPos=groovePos();stopAll();return;}
 if(d.t==="resume"){remotePaused=false;const t=ac.currentTime;
  for(const k of ["R","L"]){hg[k].gain.cancelScheduledValues(t);hg[k].gain.setTargetAtTime(volStore[k],t,.05);if(engine)engine.setHand(k,volStore[k]);}
  if((remoteMode==="band"||remoteMode==="orch")&&engine)engine.setEnabled(true);return;}
 if(d.t==="stopAll"){stopAll();return;}
 if(d.t==="master"){if(!Number.isFinite(Number(d.v)))throw new Error("עוצמה לא תקינה");applyMaster(d.v);return;}
 if(d.t==="sync"){takeClock(d,false);return;}
 if(d.t==="pong"){takeClock(d,Date.now()-d.t);return;}
 if(d.t==="mode"){if(d.mode!=="notes"&&d.mode!=="drums"&&d.mode!=="band"&&d.mode!=="orch")throw new Error("מצב לא מוכר");
  remoteMode=d.mode;
  const groove=remoteMode==="band"||remoteMode==="orch";
  if(!groove){bandOn.R=[0,0,0,0,0];bandOn.L=[0,0,0,0,0];if(engine)engine.stopAll();}
  else {if(engine&&engine.setArrangement)engine.setArrangement(remoteMode==="orch"?"orch":"band");if(!remotePaused&&engine)engine.setEnabled(true);}
  renderNotes();return;}
 if(d.t==="layer"){const k=d.hand,i=d.i|0;if((k!=="R"&&k!=="L")||i<0||i>4)throw new Error("שכבת כלים לא תקינה");
  const on=!!d.on&&!remotePaused;bandOn[k][i]=on?1:0;if(engine)engine.setLayer(k,i,on);renderNotes();return;}
 if(d.t==="lights"){applyLights(d);return;}
 if(d.t==="drum"){const k=d.hand,i=d.i|0,vol=Number(d.vol);
  if((k!=="R"&&k!=="L")||i<0||i>4||!Number.isFinite(vol))throw new Error("מכת תוף לא תקינה");
  if(remotePaused)return;
  if(!engine)throw new Error("השמע עוד לא הופעל");engine.triggerDrum(k,i,vol);
  if(drumGlow[k])drumGlow[k][i]=performance.now()+220;
  if((k==="L"&&i===3)||(d.name&&String(d.name).indexOf("קראש")>=0))whiteUntil=performance.now()+180;
  showHit(d.name||HM.DRUMS[k][i]);return;}
 if(d.t==="vol"){
  if(d.hand!=="R"&&d.hand!=="L"||!Number.isFinite(Number(d.v)))throw new Error("עדכון עוצמה לא תקין");
  volStore[d.hand]=Number(d.v);
  if(!remotePaused){const t=ac.currentTime;hg[d.hand].gain.cancelScheduledValues(t);hg[d.hand].gain.setTargetAtTime(volStore[d.hand],t,.05);if(engine)engine.setHand(d.hand,volStore[d.hand]);}
  return;
 }
 if(d.t==="noteOn"||d.t==="noteOff"){
  const k=d.hand,i=d.i|0;
  if((k!=="R"&&k!=="L")||!voices[k]||!voices[k][i])throw new Error("תו לא מוכר");
  const vc=voices[k][i],on=d.t==="noteOn"&&!remotePaused;
  vc.on=on;if(d.name)vc.label=d.name;
  const t=ac.currentTime;vc.g.gain.cancelScheduledValues(t);vc.g.gain.setTargetAtTime(on?.65:0,t,on?.01:.08);
  renderNotes();return;
 }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error(src));document.head.appendChild(s);});}
function dropPeer(){
 epoch++;
 if(pingTimer){clearInterval(pingTimer);pingTimer=null;}
 const oldc=conn,oldp=peer;conn=null;peer=null;
 try{oldc&&oldc.close();}catch(e){}
 try{oldp&&oldp.destroy();}catch(e){}
}
let reconnecting=false;
function lost(why){
 if(reconnecting)return;
 reconnecting=true;
 stopAll();
 if(why)showErr(why);
 const wait=Math.min(8000,1000*2**attempt++);
 setStatus("החיבור נותק. ניסיון חדש בעוד "+Math.ceil(wait/1000)+" שנ׳…","bad");
 timer=setTimeout(()=>{reconnecting=false;timer=null;connect();},wait);
}
function connect(){
 dropPeer();
 const my=epoch;
 setStatus("מתחברים לחדר…");
 try{peer=new Peer();}catch(e){lost("יצירת החיבור נכשלה: "+(e&&e.message||e));return;}
 peer.on("open",()=>{
  if(my!==epoch)return;
  try{conn=peer.connect(room,{reliable:true});}
  catch(e){lost("ההתחברות לחדר נכשלה: "+(e&&e.message||e));return;}
  conn.on("open",()=>{if(my!==epoch)return;attempt=0;reconnecting=false;$("err").textContent="";setStatus("מחובר לחדר","ok");
   const ping=()=>{if(conn&&conn.open)conn.send({t:"ping",t:Date.now(),n:Math.random()});};
   ping();if(pingTimer)clearInterval(pingTimer);pingTimer=setInterval(ping,3000);});
  conn.on("data",d=>{if(my!==epoch)return;try{applyMsg(d);}catch(e){showErr("שגיאה בהשמעה: "+(e&&e.message||e));}});
  conn.on("close",()=>{if(my!==epoch)return;lost("הקשר למחשב נותק.");});
  conn.on("error",e=>{if(my!==epoch)return;lost("שגיאת ערוץ: "+(e&&e.message||e));});
 });
 peer.on("disconnected",()=>{if(my!==epoch)return;lost("החיבור לשרת נותק.");});
 peer.on("error",e=>{
  if(my!==epoch)return;
  const type=e&&e.type;
  if(type==="peer-unavailable")lost("המחשב המנגן לא זמין. ודאו שהנגן פועל וסרקו שוב.");
  else lost("שגיאת חיבור: "+(e&&e.message||type||e));
 });
}
const COLORS={R:[[239,68,68],[249,115,22],[234,179,8],[34,197,94],[20,184,166]],L:[[59,130,246],[99,102,241],[168,85,247],[236,72,153],[244,63,94]]};
const drumGlow={R:[0,0,0,0,0],L:[0,0,0,0,0]};
let lights={on:0,mode:"beat",color:"#7c3aed",flash:0},whiteUntil=0,torchTrack=null,torchState=false,torchBusy=false,torchBlocked=false,lastCrash=0,wakeLock=null;
function iosDevice(){const ua=navigator.userAgent||"";return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function hexRgb(h){const m=/^#([0-9a-f]{6})$/i.exec(h||"");if(!m)return [124,58,237];const n=parseInt(m[1],16);return [(n>>16)&255,(n>>8)&255,n&255];}
function applyLights(d){if(!d||(d.mode!=="beat"&&d.mode!=="steady"&&d.mode!=="strobe"))throw new Error("מצב תאורה לא מוכר");
 if(d.color&&!/^#[0-9a-fA-F]{6}$/.test(d.color))throw new Error("צבע תאורה לא תקין");
 lights={on:d.on?1:0,mode:d.mode,color:d.color||lights.color,flash:d.flash?1:0};
 if(!lights.on||!lights.flash)setTorch(false);
 if(lights.on)keepAwake();}
function beatInfo(){if(!origin||typeof HM==="undefined"||!HM.STEP)return {phase:0,s:0,bar:0,idx:0,into:1};
 const pos=groovePos(),step=HM.STEP,idx=Math.floor(pos/step),into=pos-idx*step;
 return {phase:into/(step*4),s:((idx%16)+16)%16,bar:Math.floor(idx/16)%8,idx:idx,into:into/step};}
function activeRgbs(now){const cols=[];
 for(const k of ["R","L"])for(let j=0;j<5;j++){
  const note=remoteMode==="notes"&&voices&&voices[k]&&voices[k][j].on;
  const layer=(remoteMode==="band"||remoteMode==="orch")&&bandOn[k][j];
  if(note||layer||drumGlow[k][j]>now)cols.push(COLORS[k][j]);
 }return cols;}
function paintLights(now){const el=$("light");if(!lights.on){el.classList.remove("on");return;}
 el.classList.add("on");
 const info=beatInfo();
 if(remoteMode==="band"&&bandOn.R[0]&&(info.bar===0||info.bar===4)&&info.s===0&&info.into<0.35&&info.idx!==lastCrash){lastCrash=info.idx;whiteUntil=now+180;}
 const pulse=Math.pow(Math.max(0,1-info.phase*3.2),1.7);
 const vol=Math.max(volStore.R||0,volStore.L||0,0.35)/1.45;
 const master=Math.max(0.15,masterPct/100);
 let level=0.9;
 if(remotePaused)level=0.18;
 else if(lights.mode==="beat")level=0.22+0.78*pulse;
 else if(lights.mode==="strobe")level=info.into<0.42?1:0.04;
 const cols=lights.mode==="steady"?[]:activeRgbs(now);
 const base=cols.length?cols.reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0]).map(v=>v/cols.length):hexRgb(lights.color);
 const rgb=now<whiteUntil?[255,255,255]:base;
 const amp=now<whiteUntil?1:level*Math.min(1,vol*master);
 el.style.background="rgb("+Math.round(rgb[0]*amp)+","+Math.round(rgb[1]*amp)+","+Math.round(rgb[2]*amp)+")";
 const want=!!(lights.on&&lights.flash&&!remotePaused&&!torchBlocked&&(lights.mode==="strobe"?info.into<0.42:pulse>0.72));
 if(want!==torchState)setTorch(want);}
function lightFrame(now){paintLights(now||performance.now());requestAnimationFrame(lightFrame);}
async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==="visible")wakeLock=await navigator.wakeLock.request("screen");}
 catch(e){if($("err")&&!$("err").textContent)$("err").textContent="לא הצלחנו להשאיר את המסך דולק.";}}
function showTorchNote(msg){const n=$("torchNote");if(!n)return;n.hidden=false;n.textContent=msg;}
async function setTorch(on){if(!on){torchState=false;if(torchTrack){try{await torchTrack.applyConstraints({advanced:[{torch:false}]});}catch(e){}try{torchTrack.stop();}catch(e){}torchTrack=null;}return;}
 if(torchBlocked||torchBusy||torchState)return;
 if(iosDevice()){torchBlocked=true;showTorchNote("הפנס לא זמין באייפון. ההבהוב על המסך כן עובד.");return;}
 torchBusy=true;
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("אין מצלמה");
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  torchTrack=stream.getVideoTracks()[0];
  const caps=torchTrack.getCapabilities?torchTrack.getCapabilities():{};
  if(!caps.torch){torchTrack.stop();torchTrack=null;throw new Error("אין פנס במכשיר");}
  await torchTrack.applyConstraints({advanced:[{torch:true}]});torchState=true;}
 catch(e){torchBlocked=true;torchState=false;if(torchTrack){try{torchTrack.stop();}catch(err){}torchTrack=null;}
  showTorchNote("הפנס לא נדלק במכשיר הזה. ההבהוב על המסך כן עובד.");}
 torchBusy=false;}
if(iosDevice())showTorchNote("הפנס לא זמין באייפון. ההבהוב על המסך כן עובד. בכרום באנדרואיד אפשר להדליק פנס לפי הקצב.");
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&lights.on)keepAwake();});
$("full").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}
 catch(e){showErr("מסך מלא לא זמין בדפדפן הזה.");}};
requestAnimationFrame(lightFrame);
if(!room)$("room").textContent="חסר מספר חדר בקישור.";
else $("room").textContent="חדר: "+room;
$("go").onclick=async()=>{
 if(!room||!/^[A-Za-z0-9_-]{4,40}$/.test(room)){showErr("חסר מספר חדר בקישור. סרקו שוב את קוד ה־QR מהמחשב.");return;}
 $("go").disabled=true;
 try{audio();await ac.resume();}
 catch(e){$("go").disabled=false;showErr("לא הצלחנו להפעיל את השמע: "+(e&&e.message||e));return;}
 try{await loadScript("https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js");}
 catch(e){$("go").disabled=false;showErr("טעינת ספריית החיבור נכשלה. בדקו את האינטרנט.");return;}
 if(typeof Peer!=="function"){$("go").disabled=false;showErr("ספריית החיבור לא נטענה.");return;}
 $("go").textContent="הצליל פעיל";
 keepAwake();
 connect();
};
</script>
</body>
</html>
